steps:
  - name: "gcr.io/cloud-builders/docker"
    dir: "backend"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/futurespend-backend:$COMMIT_SHA"
      - "."

  - name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/futurespend-backend:$COMMIT_SHA"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "futurespend-backend"
      - "--image=gcr.io/$PROJECT_ID/futurespend-backend:$COMMIT_SHA"
      - "--region=us-central1"
      - "--platform=managed"
      - "--allow-unauthenticated"
      - "--quiet"

images:
  - "gcr.io/$PROJECT_ID/futurespend-backend:$COMMIT_SHA"
